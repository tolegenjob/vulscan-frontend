name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # комментарий с ошибками сборки и коммит package-lock.json

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: bash
        run: npm install --no-audit --no-fund 2>&1 | tee build.log
      - name: Lint
        shell: bash
        run: set -o pipefail; npm run lint 2>&1 | tee -a build.log
      - name: Test
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee -a build.log
      - name: Build
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee -a build.log
      - name: Commit lock file
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update package-lock.json"
            git push
          fi
      - name: Report failure as commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI failed. Key lines:"
            echo '```'
            grep -E "error|Error|FAIL|✗|×|Unable|Cannot|Expected|Received|TS[0-9]+|warning" build.log | grep -v "npm warn" | head -70
            echo '```'
            echo "Log tail:"
            echo '```'
            tail -n 40 build.log
            echo '```'
          } | head -c 60000 > failure.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@failure.md
